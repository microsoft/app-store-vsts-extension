name: Assign triage label to new tickets and add to project board
on:
  issues:
    types: [opened]

jobs:
  assignTriagenAndAddToProject: 
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
    - uses: actions/checkout@50fbc622fc4ef5163becd7fab6573eac35f8462e # v1.2.0
    - name: "Add triage label"
      uses: actions-ecosystem/action-add-labels@18f1af5e3544586314bbe15c0273249c770b2daf # v1.1.3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        labels: triage
    - name: "Assign issues to project board"
      uses: srggrs/assign-one-project-github-action@ee9e04cf29076579440cf7a149b0d5647467dc5b # 1.2.0
      with:
        project: 'https://github.com/orgs/microsoft/projects/48'
        column_name: 'Backlog'