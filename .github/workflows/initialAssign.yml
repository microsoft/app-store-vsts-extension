name: Assign triage label to new tickets and add to project board
on:
  issues:
    types: [opened]

jobs:
  assignTriagenAndAddToProject: 
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: "Add triage label"
      uses: actions-ecosystem/action-add-labels@18f1af5e3544586314bbe15c0273249c770b2daf # v1.1.3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        labels: triage
    - name: "Assign issues to project board"
      uses: srggrs/assign-one-project-github-action@65a8ddab497df42ef268001e67bbf976f8fd39e1 # 1.3.1
      with:
        project: 'https://github.com/orgs/microsoft/projects/48'
        column_name: 'Backlog'